name: Local Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - "backend/**"
      - ".github/workflows/supabase-local.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "backend/**"
      - ".github/workflows/supabase-local.yml"

permissions:
  contents: read

concurrency:
  group: local-supabase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    name: Local Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI v3
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      # No login, link, remote URL, or Production secrets are provided.
      # Supabase CLI v3 database commands target the local stack by default.
      - name: Start isolated local Supabase stack and apply migrations
        shell: bash
        run: |
          log_file="${RUNNER_TEMP}/supabase-start.log"
          if ! supabase start >"$log_file" 2>&1; then
            # The CLI prints local default API and Storage keys in its startup banner.
            # Keep failure diagnostics while redacting those values from public CI logs.
            sed -E \
              -e 's/sb_secret_[A-Za-z0-9_-]+/[REDACTED]/g' \
              -e 's/(Access Key[[:space:]]+│[[:space:]]+)[A-Za-z0-9]+/\1[REDACTED]/g' \
              -e 's/(Secret Key[[:space:]]+│[[:space:]]+)[A-Za-z0-9]+/\1[REDACTED]/g' \
              "$log_file"
            exit 1
          fi
          echo "Local Supabase stack started; all repository migrations applied successfully."

      - name: Export local Supabase credentials without exposing them in logs
        shell: bash
        run: |
          env_output="$(supabase status -o env)"
          api_url="$(printf '%s\\n' "$env_output" | sed -n 's/^API_URL=//p' | head -n 1 | tr -d '"')"
          service_role_key="$(printf '%s\\n' "$env_output" | sed -n 's/^SERVICE_ROLE_KEY=//p' | head -n 1 | tr -d '"')"

          if [[ "$api_url" != "http://127.0.0.1:54321" ]]; then
            echo "Expected the local Supabase API at http://127.0.0.1:54321; refusing to run integration tests against any other URL."
            exit 1
          fi
          if [[ -z "$service_role_key" ]]; then
            echo "The local Supabase SERVICE_ROLE_KEY was not returned by the CLI."
            exit 1
          fi

          echo "::add-mask::$service_role_key"
          {
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
          } >> "$GITHUB_ENV"
          echo "Verified local Supabase endpoint: $api_url"

      - name: Set up Python for backend integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run real Supabase authentication integration tests
        working-directory: backend
        env:
          DATABASE_BACKEND: supabase
          DATABASE_MODE: supabase
          JWT_SECRET_KEY: local-ci-only-jwt-secret-32-characters
          JWT_ALGORITHM: HS256
          ADMIN_REGISTRATION_SECRET: local-ci-admin-registration-secret
          ENVIRONMENT: development
          ALLOWED_ORIGINS: http://localhost:3000
        run: pytest -q integration_tests

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
