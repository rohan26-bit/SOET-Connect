<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumni Portal for SOET</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11.11.13/dist/framer-motion.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0f172a;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --sidebar: #0f172a;
      --sidebar-fg: #e2e8f0;
      --sidebar-muted: #94a3b8;
      --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
      --shadow-md: 0 4px 16px rgba(15,23,42,.08);
      --radius: 12px;
      --radius-sm: 8px;
      --font: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
      --font-mono: "Cascadia Code", "SF Mono", ui-monospace, monospace;
      --nav-h: 64px;
      --side-w: 260px;
    }
    [data-theme="dark"] {
      --bg: #0b1220;
      --surface: #111827;
      --fg: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(255,255,255,.08);
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --secondary: #e2e8f0;
      --sidebar: #020617;
      --sidebar-fg: #e2e8f0;
      --sidebar-muted: #64748b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
      --shadow-md: 0 8px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; }
    img { max-width: 100%; display: block; }
    ::selection { background: color-mix(in srgb, var(--primary) 25%, transparent); }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .public-nav {
      height: var(--nav-h); display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.25rem; background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: .7rem; font-weight: 600; letter-spacing: -.01em; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .04em;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 35%, transparent);
    }
    .nav-links { display: flex; align-items: center; gap: .25rem; }
    .nav-links a, .nav-links button.nav-link {
      padding: .5rem .85rem; border-radius: 8px; color: var(--muted); font-weight: 510; font-size: 14px; letter-spacing: .02em;
    }
    .nav-links a:hover, .nav-links button.nav-link:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 5%, transparent); }
    .nav-cta {
      margin-left: .5rem; background: var(--primary); color: #fff !important; padding: .55rem 1rem !important;
      border-radius: 10px; font-weight: 600; box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 30%, transparent);
    }
    .nav-cta:hover { background: var(--primary-hover); }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
      color: var(--muted); border: 1px solid transparent;
    }
    .icon-btn:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); }
    .mobile-only { display: none; }
    @media (max-width: 900px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: inline-flex; }
      .nav-links.public-links { display: none; }
      .public-nav.open .nav-links.public-links {
        display: flex; flex-direction: column; position: absolute; top: var(--nav-h); left: 0; right: 0;
        background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem; gap: .25rem;
      }
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
      padding: .65rem 1.1rem; border-radius: 10px; font-weight: 600; font-size: 14px; letter-spacing: .02em;
      transition: transform .12s ease, background .15s ease, box-shadow .15s ease; min-height: 44px;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 28%, transparent); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
    .btn-secondary:hover { background: color-mix(in srgb, var(--fg) 4%, var(--surface)); }
    .btn-ghost { color: var(--muted); }
    .btn-ghost:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 5%, transparent); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: .4rem .75rem; min-height: 36px; font-size: 13px; border-radius: 8px; }
    .btn-block { width: 100%; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.15rem;
    }
    .card-hover { transition: transform .15s ease, box-shadow .15s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

    .field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .9rem; }
    .field label { font-size: 13px; font-weight: 550; color: var(--fg); letter-spacing: .02em; }
    .field input, .field select, .field textarea {
      width: 100%; padding: .7rem .85rem; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--fg); min-height: 44px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field textarea { min-height: 100px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    .field .hint { font-size: 12px; color: var(--muted); }

    .badge {
      display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .55rem; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }
    .badge-primary { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
    .badge-success { background: color-mix(in srgb, var(--success) 15%, transparent); color: #15803d; }
    [data-theme="dark"] .badge-success { color: #4ade80; }
    .badge-warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: #b45309; }
    .badge-muted { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--muted); }

    .avatar {
      width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 600; font-size: 14px; color: #fff; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), #1e40af);
    }
    .avatar.lg { width: 72px; height: 72px; font-size: 24px; }
    .avatar.sm { width: 32px; height: 32px; font-size: 12px; }

    .layout-app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--side-w); background: var(--sidebar); color: var(--sidebar-fg); display: flex; flex-direction: column;
      position: fixed; inset: 0 auto 0 0; z-index: 50; transition: transform .2s ease;
    }
    .sidebar-head { padding: 1.1rem 1.15rem; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: .7rem; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: .85rem .65rem; display: flex; flex-direction: column; gap: .15rem; }
    .side-link {
      display: flex; align-items: center; gap: .7rem; padding: .65rem .75rem; border-radius: 10px;
      color: var(--sidebar-muted); font-weight: 510; font-size: 14px; letter-spacing: .01em; text-align: left; width: 100%;
    }
    .side-link:hover { background: rgba(255,255,255,.06); color: var(--sidebar-fg); }
    .side-link.active { background: color-mix(in srgb, var(--primary) 85%, #000); color: #fff; }
    .side-section { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--sidebar-muted); padding: .85rem .75rem .35rem; font-weight: 600; }
    .sidebar-foot { padding: .85rem; border-top: 1px solid rgba(255,255,255,.08); }
    .main-wrap { flex: 1; margin-left: var(--side-w); min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0 1.25rem; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 30;
    }
    .page { padding: 1.25rem; flex: 1; }
    .page-title { font-size: clamp(1.35rem, 2vw, 1.65rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
    .page-sub { color: var(--muted); font-size: 14px; margin-top: .25rem; }
    .breadcrumbs { display: flex; align-items: center; gap: .4rem; font-size: 13px; color: var(--muted); margin-bottom: .85rem; flex-wrap: wrap; }
    .breadcrumbs span.sep { opacity: .5; }
    .breadcrumbs strong { color: var(--fg); font-weight: 550; }

    @media (max-width: 960px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0; }
      .sidebar-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 45; }
    }

    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

    .stat-card .label { font-size: 12px; color: var(--muted); font-weight: 550; letter-spacing: .04em; text-transform: uppercase; }
    .stat-card .value { font-size: 1.75rem; font-weight: 600; letter-spacing: -.02em; margin: .25rem 0; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
    .stat-card .delta { font-size: 12px; color: var(--muted); }

    .search-box {
      display: flex; align-items: center; gap: .5rem; padding: 0 .85rem; height: 42px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); min-width: 200px; flex: 1; max-width: 420px;
    }
    .search-box input { border: none; background: transparent; outline: none; width: 100%; color: var(--fg); }
    .search-box svg { color: var(--muted); flex-shrink: 0; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: .75rem 1rem; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; background: color-mix(in srgb, var(--bg) 80%, var(--surface)); }
    td { padding: .85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: color-mix(in srgb, var(--primary) 3%, transparent); }

    .hero {
      position: relative; overflow: hidden; padding: clamp(3rem, 8vw, 5.5rem) 1.25rem;
      background: var(--secondary); color: #f8fafc;
    }
    .hero-inner { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1.15fr .85fr; gap: 2.5rem; align-items: center; }
    @media (max-width: 900px) { .hero-inner { grid-template-columns: 1fr; } }
    .hero h1 { font-size: clamp(2rem, 4.5vw, 3.25rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.08; max-width: 16ch; }
    .hero p.lead { color: #cbd5e1; font-size: clamp(1rem, 1.5vw, 1.125rem); margin: 1.1rem 0 1.6rem; max-width: 48ch; line-height: 1.55; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; }
    .hero-panel {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 1.25rem;
      backdrop-filter: blur(8px);
    }
    .section { padding: clamp(2.5rem, 5vw, 4rem) 1.25rem; }
    .section-inner { max-width: 1120px; margin: 0 auto; }
    .section-head { margin-bottom: 1.75rem; }
    .section-head h2 { font-size: clamp(1.5rem, 2.5vw, 1.9rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
    .section-head p { color: var(--muted); margin-top: .4rem; max-width: 55ch; }
    .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: .5rem; }

    .footer {
      border-top: 1px solid var(--border); background: var(--surface); padding: 2.5rem 1.25rem 1.5rem; margin-top: auto;
    }
    .footer-inner { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .footer-inner { grid-template-columns: 1fr 1fr; } }
    .footer h4 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .75rem; }
    .footer a { display: block; color: var(--muted); font-size: 14px; padding: .25rem 0; }
    .footer a:hover { color: var(--primary); }
    .footer-bottom { max-width: 1120px; margin: 1.5rem auto 0; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }

    .auth-page {
      min-height: calc(100vh - var(--nav-h)); display: grid; place-items: center; padding: 2rem 1.25rem;
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, color-mix(in srgb, var(--primary) 12%, transparent), transparent),
        var(--bg);
    }
    .auth-card { width: 100%; max-width: 440px; }
    .tabs { display: flex; gap: .35rem; background: var(--bg); padding: .3rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.1rem; }
    .tab {
      flex: 1; padding: .55rem; border-radius: 9px; font-weight: 550; font-size: 13px; letter-spacing: .02em; color: var(--muted);
    }
    .tab.active { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

    .chat-layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - var(--nav-h) - 2.5rem); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
    @media (max-width: 800px) { .chat-layout { grid-template-columns: 1fr; height: auto; min-height: 70vh; } .chat-sidebar { max-height: 220px; } }
    .chat-sidebar { border-right: 1px solid var(--border); overflow-y: auto; }
    .chat-item { display: flex; gap: .7rem; padding: .85rem 1rem; border-bottom: 1px solid var(--border); cursor: pointer; text-align: left; width: 100%; }
    .chat-item:hover, .chat-item.active { background: color-mix(in srgb, var(--primary) 6%, transparent); }
    .chat-main { display: flex; flex-direction: column; min-height: 0; }
    .chat-head { padding: .85rem 1rem; border-bottom: 1px solid var(--border); font-weight: 600; }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .65rem; background: var(--bg); min-height: 280px; }
    .bubble { max-width: 75%; padding: .65rem .9rem; border-radius: 14px; font-size: 14px; line-height: 1.45; }
    .bubble.me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .chat-compose { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid var(--border); background: var(--surface); }
    .chat-compose input { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: .65rem .85rem; background: var(--bg); outline: none; min-height: 44px; }
    .chat-compose input:focus { border-color: var(--primary); }

    .skeleton { background: linear-gradient(90deg, color-mix(in srgb, var(--muted) 12%, transparent) 25%, color-mix(in srgb, var(--muted) 18%, transparent) 50%, color-mix(in srgb, var(--muted) 12%, transparent) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sk-line { height: 12px; margin-bottom: 8px; }
    .sk-title { height: 18px; width: 40%; margin-bottom: 12px; }
    .sk-block { height: 80px; }

    .empty {
      text-align: center; padding: 2.5rem 1.25rem; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface);
    }
    .empty h3 { color: var(--fg); font-weight: 600; margin: .5rem 0 .35rem; }
    .empty p { font-size: 14px; max-width: 36ch; margin: 0 auto .9rem; }

    .toast-wrap { position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 100; display: flex; flex-direction: column; gap: .5rem; max-width: 360px; }
    .toast {
      background: var(--secondary); color: #f8fafc; padding: .85rem 1rem; border-radius: 12px; box-shadow: var(--shadow-md);
      display: flex; align-items: flex-start; gap: .65rem; font-size: 14px; animation: toastIn .25s ease;
    }
    [data-theme="dark"] .toast { background: #1e293b; border: 1px solid var(--border); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .toast.success { border-left: 3px solid var(--success); }

    .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .chip {
      padding: .4rem .8rem; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; font-weight: 510;
      color: var(--muted); background: var(--surface); letter-spacing: .01em;
    }
    .chip.active { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
    .pagination { display: flex; align-items: center; justify-content: center; gap: .35rem; margin-top: 1.25rem; }
    .page-btn {
      min-width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
      font-weight: 550; font-size: 13px; color: var(--muted);
    }
    .page-btn.active, .page-btn:hover { border-color: var(--primary); color: var(--primary); }

    .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: .5rem; }
    .chart-bars .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .chart-bars .bar { width: 100%; max-width: 36px; border-radius: 6px 6px 2px 2px; background: var(--primary); min-height: 4px; }
    .chart-bars .bar-label { font-size: 10px; color: var(--muted); letter-spacing: .02em; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 80; display: grid; place-items: center; padding: 1rem; }
    .modal { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 480px; padding: 1.35rem; box-shadow: var(--shadow-md); max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; margin-bottom: .35rem; }
    .modal p.sub { color: var(--muted); font-size: 14px; margin-bottom: 1rem; }

    .person-row { display: flex; align-items: center; gap: .75rem; }
    .person-meta { min-width: 0; }
    .person-meta .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .person-meta .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .list-stack { display: flex; flex-direction: column; gap: .65rem; }
    .row-card { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .divider { height: 1px; background: var(--border); margin: 1rem 0; }
    .stack-sm { display: flex; flex-direction: column; gap: .5rem; }
    .row { display: flex; align-items: center; gap: .5rem; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 12px; }
    .fw-600 { font-weight: 600; }
    .mt-1 { margin-top: .5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-1 { margin-bottom: .5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .gap-1 { gap: .5rem; }
    .flex { display: flex; }
    .flex-1 { flex: 1; min-width: 0; }
    .items-center { align-items: center; }
    .wrap { flex-wrap: wrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    .feature-icon {

    function DirectoryPage() {
      const { toast, user, navigate } = useApp();
      const [q, setQ] = useState('');
      const [branch, setBranch] = useState('All');
      const [page, setPage] = useState(1);
      const per = 4;
      const filtered = ALUMNI.filter(a => {
        const matchQ = !q || [a.name, a.company, a.title, a.skills.join(' ')].join(' ').toLowerCase().includes(q.toLowerCase());
        const matchB = branch === 'All' || a.branch === branch;
        return matchQ && matchB;
      });
      const total = Math.max(1, Math.ceil(filtered.length / per));
      const slice = filtered.slice((page - 1) * per, page * per);
      const body = (
        <>
          {user && <Breadcrumbs items={[{ label: 'Home', href: user.role === 'student' ? '/student' : `/${user.role}` }, { label: 'Alumni directory' }]} />}

          <div className="filters" data-od-id="directory-filters">
            {['All', 'CSE', 'IT', 'ECE', 'ME', 'EE'].map(b => (
              <button key={b} className={`chip ${branch === b ? 'active' : ''}`} onClick={() => { setBranch(b); setPage(1); }}>{b}</button>
            ))}
          </div>
          {slice.length === 0 ? (
            <EmptyState title="No alumni found" body="Try another branch or clear your search." action={<button className="btn btn-secondary btn-sm" onClick={() => { setQ(''); setBranch('All'); }}>Reset filters</button>} />
          ) : (
            <div className="grid grid-2">
              {slice.map(a => (
                <div key={a.id} className="card card-hover" data-od-id={`alumni-card-${a.id}`}>
                  <div className="row-between mb-1">
                    <div className="person-row">
                      <div className="avatar">{a.name.split(' ').map(w=>w[0]).join('')}</div>

                        <div className="name">{a.name}</div>

          <h1 className="page-title mb-2" data-od-id="events-title">Event management</h1>
          <div className="grid grid-2">
            {EVENTS.map(e => (
              <div key={e.id} className="card card-hover" data-od-id={`event-card-${e.id}`}>
                <div className="row-between mb-1">
                  <span className="badge badge-primary">{e.type}</span>
                  <span className="text-xs muted mono">{e.registered}/{e.seats} seats</span>
                </div>
                <h3 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>{e.title}</h3>
                <div className="text-sm muted mb-1">{e.date} · {e.time}</div>
                <div className="text-sm muted mb-1 row gap-1"><I.map /> {e.location}</div>
                <div className="mt-1" style={{ height: 6, background: 'var(--bg)', borderRadius: 99, overflow: 'hidden' }}>
                  <div style={{ width: `${(e.registered / e.seats) * 100}%`, height: '100%', background: 'var(--primary)', borderRadius: 99 }} />
                </div>
                <button
                  className="btn btn-primary btn-sm mt-1"
                  disabled={registered[e.id]}
                  onClick={() => {
                    if (!user) { toast('Sign in to register'); return; }
                    setRegistered(r => ({ ...r, [e.id]: true }));
                    toast(`Registered for ${e.title} (demo)`, 'success');
                  }}
                >
                  {registered[e.id] ? 'Registered' : 'Register'}
                </button>
              </div>
            ))}
          </div>
        </Wrap>
      );
    }

    function ChatPage() {
      const { user } = useApp();
      const [active, setActive] = useState(CHATS[0].id);
      const [msgs, setMsgs] = useState(() => Object.fromEntries(CHATS.map(c => [c.id, c.messages])));
      const [text, setText] = useState('');
      const chat = CHATS.find(c => c.id === active);
      const send = () => {
        if (!text.trim()) return;
        setMsgs(m => ({
          ...m,
          [active]: [...m[active], { id: Date.now(), from: 'me', text: text.trim(), time: 'Now' }],
        }));
        setText('');
      };
      return (
        <AppLayout>
          <Breadcrumbs items={[{ label: 'Home', href: `/${user.role}` }, { label: 'Chat' }]} />
          <h1 className="page-title mb-2" data-od-id="chat-title">Messages</h1>
          <div className="chat-layout" data-od-id="chat-ui">
            <div className="chat-sidebar">
              {CHATS.map(c => (
                <button key={c.id} className={`chat-item ${active === c.id ? 'active' : ''}`} onClick={() => setActive(c.id)}>
                  <div className="avatar sm">{c.name.split(' ').map(w=>w[0]).join('')}</div>
                  <div className="person-meta">
                    <div className="name">{c.name} {c.unread ? <span className="badge badge-primary">{c.unread}</span> : null}</div>
                    <div className="sub">{c.last}</div>
                  </div>
                </button>
              ))}
            </div>
            <div className="chat-main">
              <div className="chat-head">{chat.name} <span className="muted text-sm fw-400">· {chat.role}</span></div>
              <div className="chat-msgs">
                {(msgs[active] || []).map(m => (
                  <div key={m.id} className={`bubble ${m.from === 'me' ? 'me' : 'them'}`}>{m.text}</div>
                ))}
              </div>
              <div className="chat-compose">
                <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Write a message…" aria-label="Message" />
                <button className="btn btn-primary btn-sm" onClick={send} aria-label="Send"><I.send /></button>
              </div>
            </div>
          </div>
        </AppLayout>
      );
    }

    function ProfilePage() {
      const { user, toast } = useApp();
      const [edit, setEdit] = useState(false);
      const [bio, setBio] = useState('Final-year CSE student at SOET focused on full-stack development and open-source. Seeking SDE roles and mentorship in system design.');
      return (
        <AppLayout>
          <Breadcrumbs items={[{ label: 'Home', href: `/${user.role === 'admin' ? 'admin' : user.role}` }, { label: 'Profile' }]} />
          <div className="card mb-2" data-od-id="profile-header">
            <div className="row gap-1 wrap" style={{ alignItems: 'flex-start' }}>
              <div className="avatar lg">{user.avatar}</div>
              <div className="flex-1">
                <h1 className="page-title">{user.name}</h1>
                <p className="page-sub">{user.title} · {user.company}</p>
                <div className="row gap-1 wrap mt-1">
                  <span className="badge badge-primary">{user.role}</span>
                  <span className="badge badge-muted">Batch {user.batch}</span>
                  <span className="badge badge-muted">{user.branch}</span>
                </div>
              </div>
              <button className="btn btn-secondary btn-sm" onClick={() => setEdit(true)}>Edit profile</button>
            </div>
          </div>
          <div className="grid grid-2">
            <div className="card">
              <h2 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>About</h2>
              <p className="text-sm" style={{ lineHeight: 1.55 }}>{bio}</p>
            </div>
            <div className="card">
              <h2 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>Contact</h2>
              <div className="stack-sm text-sm">
                <div><span className="muted">Email</span><br />{user.email}</div>
                <div><span className="muted">Branch</span><br />{user.branch}</div>
                <div><span className="muted">Batch</span><br />{user.batch}</div>
              </div>
            </div>
          </div>
          <Modal open={edit} onClose={() => setEdit(false)} title="Edit profile" sub="Changes stay local in this demo.">
            <div className="field"><label>Bio</label><textarea value={bio} onChange={e => setBio(e.target.value)} /></div>
            <button className="btn btn-primary" onClick={() => { setEdit(false); toast('Profile updated (demo)', 'success'); }}>Save</button>
          </Modal>
        </AppLayout>
      );
    }

    function NotificationsPage() {
      const { user } = useApp();
      const [items, setItems] = useState(NOTIFICATIONS);
      return (
        <AppLayout>
          <Breadcrumbs items={[{ label: 'Home', href: `/${user.role}` }, { label: 'Notifications' }]} />
          <div className="row-between mb-2">
            <h1 className="page-title" data-od-id="notifications-title">Notifications</h1>
            <button className="btn btn-secondary btn-sm" onClick={() => setItems(items.map(n => ({ ...n, read: true })))}>Mark all read</button>
          </div>
          <div className="card">
            {items.map(n => (
              <div key={n.id} className="notif-item" data-od-id={`notif-${n.id}`}>
                <div className={`notif-dot ${n.read ? 'read' : ''}`} />
                <div className="flex-1">
                  <div className="fw-600 text-sm">{n.title}</div>
                  <div className="text-sm muted">{n.body}</div>
                  <div className="text-xs muted mt-1">{n.time}</div>
                </div>
              </div>
            ))}
          </div>
        </AppLayout>
      );
    }

    function SettingsPage() {
      const { user, theme, toggleTheme, toast } = useApp();
      const Wrap = user ? AppLayout : ({ children }) => <PublicLayout><div className="section"><div className="section-inner" style={{ maxWidth: 640 }}>{children}</div></div></PublicLayout>;
      return (
        <Wrap>
          {user && <Breadcrumbs items={[{ label: 'Home', href: `/${user.role === 'admin' ? 'admin' : user.role}` }, { label: 'Settings' }]} />}
          <h1 className="page-title mb-2" data-od-id="settings-title">Settings</h1>
          <div className="card mb-1">
            <h2 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>Appearance</h2>
            <div className="row-between">
              <div>
                <div className="text-sm">Theme</div>
                <div className="text-xs muted">Currently {theme}</div>
              </div>
              <button className="btn btn-secondary btn-sm" onClick={toggleTheme}>{theme === 'dark' ? 'Switch to light' : 'Switch to dark'}</button>
            </div>
          </div>
          <div className="card mb-1">
            <h2 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>Notifications</h2>
            {['Email digests', 'Mentorship alerts', 'Event reminders'].map(label => (
              <label key={label} className="row-between" style={{ padding: '8px 0', cursor: 'pointer' }}>
                <span className="text-sm">{label}</span>
                <input type="checkbox" defaultChecked onChange={() => toast(`${label} preference saved (demo)`, 'success')} />
              </label>
            ))}
          </div>
          <div className="card">
            <h2 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>Security</h2>
            <p className="text-sm muted mb-1">Password change and 2FA will connect to your auth API.</p>
            <button className="btn btn-secondary btn-sm" onClick={() => toast('Password flow → POST /api/auth/change-password')}>Change password</button>
          </div>
        </Wrap>
      );
    }

    function AboutPage() {
      return (
        <PublicLayout>
          <div className="section" data-od-id="about-page">
            <div className="section-inner" style={{ maxWidth: 720 }}>
              <div className="eyebrow">About</div>
              <h1 className="page-title mb-1">Alumni Portal for SOET</h1>
              <p className="page-sub mb-2">A centralized web platform connecting alumni, students, and administrators for mentorship, careers, and community life at the School of Engineering & Technology.</p>
              <div className="card mb-1">
                <h2 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>What you can do</h2>
                <ul className="text-sm" style={{ paddingLeft: '1.2rem', color: 'var(--muted)', lineHeight: 1.7 }}>
                  <li>Students: discover alumni, apply to jobs/internships, join events, chat securely</li>
                  <li>Alumni: post roles, mentor juniors, host events, grow the network</li>
                  <li>Admins: verify alumni, manage users, review listings and analytics</li>
                </ul>
              </div>
              <div className="card">
                <h2 className="fw-600 mb-1" style={{ fontSize: '1.05rem' }}>Project note</h2>
                <p className="text-sm muted">This deliverable is a production-style frontend prototype for a Final Year Project. All data is demo JSON; no real authentication or backend is included.</p>
              </div>
            </div>
          </div>
        </PublicLayout>
      );
    }

    function ContactPage() {
      const { toast } = useApp();
      return (
        <PublicLayout>
          <div className="section" data-od-id="contact-page">
            <div className="section-inner" style={{ maxWidth: 560 }}>
              <div className="eyebrow">Contact</div>
              <h1 className="page-title mb-2">Get in touch</h1>
              <div className="card">
                <form onSubmit={e => { e.preventDefault(); toast('Message sent (demo — wire to POST /api/contact)', 'success'); e.target.reset(); }}>
                  <div className="field"><label>Name</label><input required name="name" /></div>
                  <div className="field"><label>Email</label><input type="email" required name="email" /></div>
                  <div className="field"><label>Subject</label><input required name="subject" /></div>
                  <div className="field"><label>Message</label><textarea required name="message" /></div>
                  <button className="btn btn-primary" type="submit">Send message</button>
                </form>
                <div className="divider" />
                <p className="text-sm muted">Email: alumni@soet.edu · Placement Cell, SOET Campus</p>
              </div>
            </div>
          </div>
        </PublicLayout>
      );
    }

    /* ========== Router ========== */
    function Router() {
      const { route, user } = useApp();
      const path = route.split('?')[0] || '/';

      const needAuth = !['/', '/login', '/register', '/about', '/contact', '/jobs', '/internships', '/events', '/directory', '/settings'].includes(path)
        && !path.startsWith('/jobs');

      if (needAuth && !user && !['/about','/contact'].includes(path)) {
        // handled in AppLayout / individual
      }

      switch (path) {
        case '/': return <LandingPage />;
        case '/login': return <LoginPage />;
        case '/register': return <RegisterPage />;
        case '/student': return user ? <StudentDashboard /> : <LoginPage />;
        case '/alumni': return user ? <AlumniDashboard /> : <LoginPage />;
        case '/alumni/post-job': return user ? <PostJobPage /> : <LoginPage />;
        case '/alumni/post-internship': return user ? <PostInternshipPage /> : <LoginPage />;
        case '/alumni/mentors': return user ? <MentorRequestsPage /> : <LoginPage />;
        case '/admin': return user ? <AdminDashboard /> : <LoginPage />;
        case '/admin/verify': return user ? <AdminVerifyPage /> : <LoginPage />;
        case '/admin/students': return user ? <AdminStudentsPage /> : <LoginPage />;
        case '/admin/alumni': return user ? <AdminAlumniPage /> : <LoginPage />;
        case '/admin/reports': return user ? <AdminReportsPage /> : <LoginPage />;
        case '/directory': return <DirectoryPage />;
        case '/jobs': return <JobsPage />;
        case '/internships': return <InternshipsPage />;
        case '/events': return <EventsPage />;
        case '/chat': return user ? <ChatPage /> : <LoginPage />;
        case '/profile': return user ? <ProfilePage /> : <LoginPage />;
        case '/notifications': return user ? <NotificationsPage /> : <LoginPage />;
        case '/settings': return <SettingsPage />;
        case '/about': return <AboutPage />;
        case '/contact': return <ContactPage />;
        default:
          return (
            <PublicLayout>
              <div className="section"><div className="section-inner">
                <EmptyState title="Page not found" body={`No route for ${path}`} action={<a className="btn btn-primary btn-sm" href="#/">Back home</a>} />
              </div></div>
            </PublicLayout>
          );
      }
    }

    function App() {
      const [route, navigate] = useHashRoute();
      const [theme, setTheme] = useState(() => localStorage.getItem('soet-theme') || 'light');
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('soet-user') || 'null'); } catch { return null; }
      });
      const [toasts, setToasts] = useState([]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('soet-theme', theme);
      }, [theme]);

      useEffect(() => {
        if (user) localStorage.setItem('soet-user', JSON.stringify(user));
        else localStorage.removeItem('soet-user');
      }, [user]);

      const toast = useCallback((message, type = '') => {
        const id = Date.now() + Math.random();
        setToasts(t => [...t, { id, message, type }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
      }, []);

      const value = {
        route, navigate,
        theme, toggleTheme: () => setTheme(t => t === 'dark' ? 'light' : 'dark'),
        user,
        login: (u) => setUser(u),
        logout: () => { setUser(null); navigate('/'); toast('Signed out'); },
        toast,
      };

      return (
        <AppCtx.Provider value={value}>
          <Router />
          <ToastHost toasts={toasts} dismiss={(id) => setToasts(t => t.filter(x => x.id !== id))} />
        </AppCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
